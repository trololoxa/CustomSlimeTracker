; Copy this file to secrets.ini or platformio.local.ini for private local builds.
; Do not commit real credentials.
; The current firmware patch set does not implement network output yet; these
; values are placeholders for a future UDP backend.

[env]
build_flags =
  -DWIFI_CREDS_SSID='"YourSSID"'
  -DWIFI_CREDS_PASSWD='"YourPassword"'
  -DSERVER_IP='"192.168.0.100"'
  -DSERVER_PORT=6969
