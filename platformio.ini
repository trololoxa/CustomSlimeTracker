; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
build_cache_dir = cache
default_envs = BOARD_LOLIN_C3_MINI_DEBUG

[env]
monitor_speed = 115200
monitor_filters = default, log2file
monitor_echo = yes
framework = arduino

build_flags =
  ; Local network credentials must not be committed. Override these in
  ; a private local environment/config when the network backend exists.
  -DWIFI_CREDS_SSID='""'
  -DWIFI_CREDS_PASSWD='""'
  -DSERVER_IP='"0.0.0.0"'
  -DSERVER_PORT=6969
  -O2
  -std=gnu++2a

build_unflags = -Os -std=gnu++11 -std=gnu++17


[env:BOARD_LOLIN_C3_MINI]
platform = espressif32
platform_packages =
  framework-arduinoespressif32
  framework-arduinoespressif32-libs
board = lolin_c3_mini

build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

[env:BOARD_LOLIN_C3_MINI_DEBUG]
extends = env:BOARD_LOLIN_C3_MINI
; Full diagnostic/development profile. It intentionally does not use -Werror
; yet: first keep the firmware buildable, then burn warnings down in small
; patches. Keep warning flags project-local. PlatformIO's build_flags also
; compile the Arduino framework and bundled libraries, which produces noise
; from upstream code we do not own. build_src_flags keeps the diagnostic
; baseline actionable.
build_flags =
  ${env:BOARD_LOLIN_C3_MINI.build_flags}
  -DTRACKER_BUILD_PROFILE=TRACKER_PROFILE_DEBUG
build_src_flags =
  -Wall
  -Wextra
  -Wshadow
  -Wdouble-promotion
  -Wformat=2
  -Wno-unused-parameter

[env:BOARD_LOLIN_C3_MINI_PRODUCTION]
extends = env:BOARD_LOLIN_C3_MINI
; Product profile: SlimeVR networking, NVS, basic CLI/setup and server
; telemetry stay available, but test/log/stream diagnostics default off.
build_flags =
  ${env:BOARD_LOLIN_C3_MINI.build_flags}
  -DTRACKER_BUILD_PROFILE=TRACKER_PROFILE_PRODUCTION
build_src_filter =
  +<*>
  -<config/tracker_config_print.cpp>
  -<runtime/machine_log_runtime.cpp>
  -<runtime/mag_status_reporter.cpp>
  -<runtime/runtime_status_reporter.cpp>
  -<runtime/runtime_test_runner.cpp>
  -<runtime/static_test_runner.cpp>
  -<runtime/gyro_temp_static_fit.cpp>
  -<serial/tracker_ahrs_commands.cpp>
  -<serial/tracker_bias_commands.cpp>
  -<serial/tracker_imu_fifo_commands.cpp>
  -<serial/tracker_output_commands.cpp>
  -<serial/tracker_test_commands.cpp>

[env:BOARD_LOLIN_C3_MINI_SLIM]
extends = env:BOARD_LOLIN_C3_MINI
; Minimal battery/size profile. It assumes Wi-Fi/server/calibration settings
; are already present in NVS and only keeps the tracking + SlimeVR quaternion
; output path enabled by default.
build_unflags =
  ${env.build_unflags}
  -O2
build_flags =
  ${env:BOARD_LOLIN_C3_MINI.build_flags}
  -DTRACKER_BUILD_PROFILE=TRACKER_PROFILE_SLIM
  -Os
build_src_filter =
  +<*>
  -<runtime/battery_runtime.cpp>
  -<runtime/machine_log_runtime.cpp>
  -<runtime/mag_status_reporter.cpp>
  -<runtime/runtime_status_reporter.cpp>
  -<runtime/runtime_test_runner.cpp>
  -<runtime/static_test_runner.cpp>
  -<runtime/status_led_runtime.cpp>
  -<runtime/tap_accumulator.cpp>
  -<runtime/tap_runtime_controller.cpp>
  -<runtime/tracker_console_suppress.cpp>
  -<runtime/gyro_temp_calibration_capture.cpp>
  -<runtime/gyro_temp_static_fit.cpp>
  -<sensor/accel_6pos_calibration.cpp>
  -<sensor/fifo_calibrations.cpp>
  -<app/tracker_command_wiring.cpp>
  -<config/tracker_config_print.cpp>
  -<serial/tracker_ahrs_commands.cpp>
  -<serial/tracker_battery_commands.cpp>
  -<serial/tracker_bias_commands.cpp>
  -<serial/tracker_calibration_commands.cpp>
  -<serial/tracker_config_commands.cpp>
  -<serial/tracker_imu_fifo_commands.cpp>
  -<serial/tracker_led_commands.cpp>
  -<serial/tracker_mag_commands.cpp>
  -<serial/tracker_network_commands.cpp>
  -<serial/tracker_output_commands.cpp>
  -<serial/tracker_serial_commands.cpp>
  -<serial/tracker_setup_commands.cpp>
  -<serial/tracker_slimevr_commands.cpp>
  -<serial/tracker_slimevr_serial_compat_commands.cpp>
  -<serial/tracker_tap_commands.cpp>
  -<serial/tracker_test_commands.cpp>
  -<serial/tracker_system_commands.cpp>

[env:BOARD_LOLIN_C3_MINI_DIAG]
extends = env:BOARD_LOLIN_C3_MINI_DEBUG
; Backward-compatible alias for scripts or habits that still refer to DIAG.
