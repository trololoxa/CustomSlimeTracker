; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
build_cache_dir = cache
default_envs = BOARD_LOLIN_C3_MINI

[env]
monitor_speed = 115200
monitor_filters = default, log2file
monitor_echo = yes
framework = arduino

build_flags =
  ; Local network credentials must not be committed. Override these in
  ; a private local environment/config when the network backend exists.
  -DWIFI_CREDS_SSID='""'
  -DWIFI_CREDS_PASSWD='""'
  -DSERVER_IP='"0.0.0.0"'
  -DSERVER_PORT=6969
  
  -O2
  -std=gnu++2a

build_unflags = -Os -std=gnu++11 -std=gnu++17


[env:BOARD_LOLIN_C3_MINI]
platform = espressif32
platform_packages =
  framework-arduinoespressif32
  framework-arduinoespressif32-libs
board = lolin_c3_mini

build_flags =
  ${env.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
